services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: knittrack_core_bootstrap
      POSTGRES_PASSWORD: knittrack-core-disposable-only
    volumes:
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ../../migrations:/workspace/supabase/migrations:ro
      - ../../seed:/workspace/supabase/seed:ro
      - ./:/workspace/supabase/tests/core-baseline:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knittrack_core_bootstrap -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
