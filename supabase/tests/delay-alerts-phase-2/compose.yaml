services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      # The image bootstrap superuser is kept separate from the non-superuser
      # migration role created by bootstrap.sql.
      POSTGRES_USER: knittrack_bootstrap
      POSTGRES_PASSWORD: knittrack-disposable-test-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ../../../supabase/proposals:/workspace/supabase/proposals:ro
      - ./:/workspace/supabase/tests/delay-alerts-phase-2:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knittrack_bootstrap -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
